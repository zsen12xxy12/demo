<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flowboard · 让工作有条不紊</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="/">▥ <span>Flowboard</span></a><span class="local">● 本地工作空间</span></header>
<main><section class="intro"><div><p class="eyebrow">你的想法，正在向前</p><h1>把计划变成进展。</h1><p class="muted">一张看板，让每一步都清晰可见。</p></div><button id="new" class="primary">＋ 新建任务</button></section>
<section class="overview" aria-label="看板统计"><div><span id="total">0</span><small>全部任务</small></div><div><span id="active">0</span><small>正在推进</small></div><div><span id="completed">0%</span><small>完成进度</small></div><div class="progress"><div id="progress"></div></div></section>
<section class="toolbar"><label class="search">⌕ <input id="search" type="search" placeholder="搜索任务或描述…" aria-label="搜索任务"></label><select id="filter" aria-label="筛选优先级"><option value="all">所有优先级</option><option value="high">高优先级</option><option value="medium">中优先级</option><option value="low">低优先级</option></select></section>
<div id="board" class="board"></div><p id="notice" role="status" class="muted footer">任务仅保存在当前浏览器，无需登录。</p></main>
<dialog id="editor"><form id="form"><div class="dialog-head"><h2 id="dialog-title">新建任务</h2><button type="button" id="close" aria-label="关闭">×</button></div><label>任务标题<input id="title" name="title" required maxlength="100" placeholder="下一步要做什么？"></label><label>描述<textarea id="description" name="description" rows="3" maxlength="1000" placeholder="补充一些细节（可选）"></textarea></label><div class="form-row"><label>状态<select id="status" name="status"><option value="todo">待办</option><option value="doing">进行中</option><option value="done">已完成</option></select></label><label>优先级<select id="priority" name="priority"><option value="medium">中优先级</option><option value="high">高优先级</option><option value="low">低优先级</option></select></label></div><p id="error" role="alert"></p><div class="actions"><button id="delete" type="button" class="danger">删除任务</button><button id="cancel" type="button">取消</button><button type="submit" class="primary">保存任务</button></div></form></dialog>
<script type="module" src="app.js"></script></body></html>
